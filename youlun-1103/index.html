<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單親媽×光譜小孩的共創與成長｜生生不息・溫柔孕育圈</title>
<meta name="robots" content="noindex">
<meta name="description" content="宥綸《單親媽×光譜小孩的共創與成長》這一場這次沒有成行。生生不息・溫柔孕育圈還有其他場次。">
<link rel="icon" href="../assets/logo-cut.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --clay:#f98f77; --clay-deep:#c27d6a; --sage:#9d7bb0; --sage-deep:#6d517f;
    --ink:#4a3c37; --ink-soft:#8a7268; --cream:#fdf4ef; --sand:#fbeae1; --line:#f2dacf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;
    font-family:"Noto Serif TC",serif;color:var(--ink);line-height:1.9;
    background:
      radial-gradient(70% 50% at 84% 4%, rgba(249,143,119,.22), transparent 60%),
      radial-gradient(70% 55% at 6% 100%, rgba(253,197,182,.36), transparent 60%),
      linear-gradient(165deg,var(--cream),var(--sand) 74%,#f7ddd0);
  }
  .card{
    width:100%;max-width:620px;background:rgba(255,255,255,.72);
    border:1px solid var(--line);border-radius:22px;padding:52px 44px 44px;
    box-shadow:0 26px 70px -34px rgba(120,80,60,.45);text-align:center;
  }
  .logo{width:104px;margin:0 auto 26px}
  .kicker{font-family:"Cormorant Garamond",serif;font-style:italic;
    color:var(--sage-deep);font-size:1rem;letter-spacing:.14em;margin-bottom:8px}
  h1{font-weight:500;font-size:clamp(1.5rem,5vw,1.95rem);color:var(--clay-deep);
    line-height:1.4;margin-bottom:24px}
  p{font-size:1rem;color:var(--ink);margin-bottom:16px}
  p.soft{color:var(--ink-soft);font-size:.95rem}
  .rule{width:54px;height:1px;background:var(--line);margin:30px auto}
  .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  a.btn{display:inline-block;padding:14px 28px;border-radius:999px;text-decoration:none;
    font-size:.97rem;transition:transform .15s ease,background .2s ease}
  a.btn:hover{transform:translateY(-1px)}
  a.primary{background:var(--clay);color:#fff}
  a.primary:hover{background:var(--clay-deep)}
  a.ghost{border:1px solid var(--clay);color:var(--clay-deep)}
  a.ghost:hover{background:var(--clay);color:#fff}
  @media (max-width:520px){ .card{padding:40px 24px 34px} }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../assets/logo-rose.png" alt="生生不息・溫柔孕育圈">
    <div class="kicker">Gentle Birthing Circle</div>
    <h1>《單親媽×光譜小孩的共創與成長》<br>這一場，這次沒有成行</h1>

    <p>謝謝每一個看過、問過、想過要來的妳。</p>

    <p>這是宥綸從自己的生命裡長出來的一場——一個媽媽如何在婚姻結束之後，重新學習定義「家」；又如何在發現孩子跟自己想像的不同時，選擇與他站在一起。</p>

    <p>「當我先成為自己的定錨，自然就成為孩子在這個浮動宇宙裡，起步的源頭。」</p>

    <p>這樣的一場，我們希望之後還有機會好好辦一次。</p>

    <div class="rule"></div>

    <p class="soft">孕育圈每個月都有新的一場——<br>線上的深度分享、新月夜的公益女人圈、實體的圍圈共聚。</p>

    <div class="acts">
      <a class="btn primary" href="../">看看其他場次</a>
      <a class="btn ghost" href="../circle.html">認識公益女人圈</a>
    </div>
  </div>
</body>
</html>
